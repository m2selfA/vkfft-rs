name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check all targets and features
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --all-targets --all-features
      - name: Clippy
        # Clippy's style lint set changes between Rust releases. Compiler
        # warnings remain strict in the preceding check; Clippy still reports
        # new suggestions without turning a toolchain update into a red CI.
        run: cargo clippy --all-targets --all-features
      - name: Portable library tests
        run: cargo test --lib --no-default-features
